name: ci

# Quality gates on every push and pull request, and reused by the release
# workflow (`workflow_call`) so a tag can never publish a build that would not
# have passed CI. Before this existed, the first compile of any change happened
# when a `v*` tag was pushed — i.e. a broken build broke a *release*.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

# Actions are pinned by commit SHA, not by tag: a tag is mutable, and these
# actions run with access to the release signing secrets.
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src-tauri/sidecar/cputemp/packages.lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      # tauri.conf.json declares these as bundle resources, so cargo cannot even
      # check the crate without them. PresentMon is SHA-256 verified in here.
      - name: Fetch bundled binaries (PresentMon + cputemp sidecar)
        run: pwsh scripts/fetch-binaries.ps1

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
